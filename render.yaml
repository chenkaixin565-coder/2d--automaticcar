# 智能巡检机器人二维仿真系统 —— Render 一键部署蓝图（全栈单容器）
#
# 部署步骤：
#   1. 将本仓库推送到 GitHub；
#   2. 登录 render.com（GitHub 账号即可，免费套餐无需信用卡）；
#   3. New → Blueprint → 选择本仓库 → Apply，构建约 3-5 分钟；
#   4. 得到 https://<服务名>.onrender.com 公网链接，手机/电脑直接打开。
#
# 免费套餐注意事项：
#   - 服务 15 分钟无访问会休眠，再次打开需 30-60 秒冷启动；
#     冷启动期间前端每 5 秒自动重连，连上即恢复，无需手动刷新；
#   - 引擎为内存态，休眠重启后地图与机器人回到初始状态；
#   - 区域默认 singapore（亚洲延迟较低），若 Render 报区域相关错误，
#     删除 region 一行即可（将使用默认区域）。

services:
  - type: web
    name: irm-sim-2d
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8000"
      - key: TICK_INTERVAL_MS
        value: "200"
      - key: LOG_LEVEL
        value: "INFO"
      # 访问控制（V2.2.0）：默认开放演示，任何写操作都放行。
      # 要演示"只有持有密钥的人能操作"，取消下面两行注释并换一个随机长串，
      # 前端首次写操作会弹出密钥输入框（密钥只存 sessionStorage）。
      # - key: OPERATOR_KEY
      #   value: "<换成你的随机长串>"
      # 只读展示（V2.2.0）：开启后所有写操作返回 403，适合公开展示但不允许改动。
      # - key: READONLY_MODE
      #   value: "true"
      # 限流（V2.2.0）：每客户端每分钟请求数，0 表示关闭。
      - key: RATE_LIMIT_PER_MINUTE
        value: "240"
      # 异常检测（V2.3.0）：auto = 有 numpy/scikit-learn 就用 IsolationForest，否则规则基线。
      # Render 默认镜像不装 ML 依赖（构建快、冷启动快），所以线上会显示 RuleAnomalyDetector；
      # 想在线上看到 ML，需把 Dockerfile 的 INSTALL_ML 构建参数改成 true 后重新部署。
      - key: ANOMALY_STRATEGY
        value: "auto"
      # Agent（V2.3.0）：免费实例没有 GPU，跑不动本地 7B 模型，线上保持规则解析。
      # 本地答辩时在自己的电脑上启动 Ollama，再把下面两行取消注释并填地址。
      - key: AGENT_LLM_ENABLED
        value: "false"
      # - key: AGENT_OLLAMA_URL
      #   value: "http://127.0.0.1:11434"
      # - key: AGENT_OLLAMA_MODEL
      #   value: "qwen2.5:7b"
