# 持续集成：后端 lint/测试 → 前端 lint/测试/构建 → Docker 镜像可构建
# 触发：push / PR 到 main，也可在 Actions 页面手动 Run workflow
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（ruff + pytest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        # requirements-ml.txt 里是 numpy/scikit-learn：装了才能跑 ML 异常检测用例；
        # httpx 是 FastAPI TestClient 的运行依赖，不在 requirements.txt 里。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt
          pip install pytest==8.3.3 httpx==0.27.2 ruff==0.6.9

      - name: ruff 静态检查
        run: ruff check .

      - name: pytest 单元测试
        run: pytest tests/ -q

  frontend:
    name: 前端（eslint + vitest + build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: eslint
        run: npm run lint

      - name: vitest
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker 镜像可构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像（不推送，仅验证）
        run: docker build -f deploy/Dockerfile -t irm-sim:ci .

      - name: 启动容器并检查健康接口
        run: |
          docker run -d --name irm-ci -p 8000:8000 irm-sim:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          python3 -c "import json;d=json.load(open('/tmp/health.json'));assert d['status']=='ok', d"

      - name: 清理
        if: always()
        run: docker rm -f irm-ci || true
